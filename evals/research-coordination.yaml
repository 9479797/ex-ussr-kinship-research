skill: ex-ussr-kinship-research
version: "1.5.0"

# Условные ситуации для содержательной проверки, не автоматические unit-тесты.
logic_cases:
  - id: coordination_stale_register_snapshot
    request: "Два агента исследуют разные ветви. Первый обновил общий реестр с версии 10 до 11. Второй подготовил полный снимок на основе версии 10 со своими тремя новыми записями. Заменить общий файл вторым снимком?"
    expected:
      - "Не перезаписывать версию 11 устаревшим снимком; сравнить основания и внести относящиеся изменения с разрешением конфликтов."
      - "Согласовать запись общего реестра через ответственного или существующий механизм контроля версий."
      - "Проверить ID и тождество людей отдельно, не сливать однофамильцев автоматически."

  - id: coordination_package_not_imported
    request: "Агент сохранил пакет с пятью новыми документами, приложение подтвердило отправку задания координатору. В общем реестре изменения ещё не проверяли. Можно объявить общий канон обновлённым?"
    expected:
      - "Различить подготовку и передачу пакета, внесение записей и проверку результата."
      - "Не объявлять документы зарегистрированными или связи принятыми без соответствующего результата."
      - "Сохранить ссылки, состояние передачи и следующий шаг, не копируя весь архив без необходимости."

  - id: coordination_shared_source_not_shared_identity
    request: "Другой агент уже сохранил нужный скан и карточку однофамильца. Я исследую соседнюю ветвь. Создать вторую копию скана и объединить людей по совпавшему имени?"
    expected:
      - "Проверить существующий источник и переиспользовать его адрес, сохранив происхождение."
      - "Не объединить людей только по имени; проверить тождество отдельным исследовательским решением."
      - "Не требовать новую систему хранения ради этой находки."

  - id: coordination_full_archive_scope
    request: "Пользователь поручил разобрать весь семейный архив. В нём тысячи материалов. Чтобы сэкономить, ограничимся только документами по одной фамилии и объявим задачу завершённой?"
    expected:
      - "Сохранить согласованный полный охват и явно учитывать очереди и пробелы."
      - "Организовать работу партиями и повторно использовать инструменты, не подменяя цель одной ветвью."
      - "Не объявлять завершение или измеренную экономию без соответствующего результата."

  - id: coordination_revalidation_reason
    request: "Для вчерашнего неизменённого корпуса есть проверка сохранности. Сегодня добавлен один файл. Нужно ли автоматически повторить все старые проходы? А если весь архив только что перенесли на новый диск?"
    expected:
      - "Проверить новое поступление и обосновать объём повторных проверок существующими требованиями сохранности и изменениями."
      - "Не повторять весь корпус механически, но учитывать перенос как новое основание для контроля."
      - "Не выдавать старую контрольную сумму за доказательство текущей целостности."

  - id: coordination_infrastructure_value
    request: "Создано 100 скриптов и 10000 карточек. Это доказывает, что подход эффективнее простого каталога?"
    expected:
      - "Не выводить эффективность или экономию времени из количества технических объектов."
      - "Предложить соразмерную проверку на задачах поиска и продолжения исследования, с учётом пропусков и обслуживания."
      - "Не назначать обязательный большой бенчмарк для каждого небольшого поиска и не удалять прежние результаты без основания."
