skill: ex-ussr-kinship-research
version: "1.6.0"

# Условные ситуации для содержательной проверки, не автоматические unit-тесты.
logic_cases:
  - id: next_questions_ranked_after_stage
    request: |
      Этап закончен. Онлайн прочитаны все метрики прихода за 1886–1918 гг.
      Известно: исповедные ведомости того же села за 1818–1848 гг. есть в
      онлайн-каталоге, но ещё не открывались; посемейные списки 1905 г. есть
      только в архиве, копия платная; у двух прадедов места рождения
      неизвестны. Что дальше?
    expected:
      - "Дать упорядоченный список следующих вопросов, а не общий совет «продолжать поиск»."
      - "Для каждого пункта указать, что он решит, где источник, кто выполняет и примерную стоимость, если она известна."
      - "Поставить первыми ведомости 1818–1848 гг.: агент может прочитать их сам, и они продвигают линию на поколения назад; отметить, что содержание томов ещё не проверено."
      - "Вопрос о местах рождения прадедов адресовать родственникам через документы, где записано место рождения, а не через память."
      - "Платный запрос посемейных списков поставить с ценой и указать, какой вопрос он закроет."

  - id: next_questions_as_parallel_tasks
    request: "Пользователь хочет запустить по следующим вопросам несколько параллельных агентов. Оформи задания."
    expected:
      - "Сделать каждое задание самостоятельным: цель, уже установленное со ссылками на ID, где лежат источники, критерий завершения."
      - "Развести задания по источникам и диапазонам номеров записей, чтобы они не дублировали работу и не конфликтовали в реестрах."
      - "Указать, какие задания обмениваются результатами, если одно зависит от другого."

  - id: next_questions_unverified_access
    request: "В списке следующих шагов агент пишет: «ревизские сказки 1858 г. по селу есть онлайн». Он этого не проверял, просто предполагает. Как правильно?"
    expected:
      - "Пометить доступность как непроверенную или сначала проверить каталог."
      - "Не выдавать предположение о наличии источника за установленный факт."
