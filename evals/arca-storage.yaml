skill: ex-ussr-kinship-research
version: "1.11.0"

# Условные ситуации работы с древом в Arca (references/arca.md), не автоматические unit-тесты.
logic_cases:
  - id: arca_chosen_without_asking
    request: "Собери семейное древо моего прадеда Ивана Ольшина. [Подключены инструменты Arca; проект «Моя семья» открыт в приложении, доступ edit.]"
    expected:
      - "Сразу работать с Arca: `list_projects`, проект «Моя семья», чтение имеющегося древа как материалов пользователя."
      - "Не спрашивать, использовать ли Arca, и не запрашивать подтверждение обычных записей: поручение и права подключения достаточны."
      - "Записывать в древо только установленное, со ссылками на источники и отметкой доказанности; реестры, очередь и журнал вести в папке дела."

  - id: no_arca_workflow_unchanged
    request: "Собери семейное древо моего прадеда Ивана Ольшина. [Инструментов Arca нет.]"
    expected:
      - "Вести исследование прежним порядком: дело, реестры, журнал, итоговый отчёт."
      - "Не требовать подключить Arca и не откладывать работу из-за его отсутствия."

  - id: arca_project_chosen_by_rule
    request: "Найди родителей Анны Котовой. [Arca: два проекта, ни один не открыт, изменять разрешено оба; Анна есть только в проекте «Котовы».]"
    expected:
      - "Выбрать «Котовы»: в нём найдены лица вопроса; не задавать вопроса о проекте."
      - "Если бы Анна нашлась в обоих, задать один вопрос и до ответа только читать."

  - id: arca_single_source_marked_as_such
    request: "Метрическая запись о рождении Петра прямо называет отцом Ивана; других документов нет. Внеси это в древо."
    expected:
      - "Связать Петра с Иваном со ссылкой на источник и номером записи и с отметкой `single`, а не `confirmed`."
      - "Сохранить статус `single-source` в реестре связей; не повышать отметку без второй независимой цепочки."

  - id: arca_conclusion_changes_later
    request: "Связь Пётр — Иван ранее записана в Arca как `single`. Теперь ревизская сказка независимо даёт Петру другого отца. Что сделать в древе?"
    expected:
      - "Отметить связь как `disputed` (`set_evidence`), не удаляя её; обе версии и их источники сохранить в реестре."
      - "Отразить изменение в отчёте; удалять связь — только по поручению пользователя и с правом `full`."

  - id: arca_patronymic_not_written
    request: "В Arca у Ивана Петровича Ольшина нет родителей. В ревизской сказке той же деревни есть Пётр Ольшин. Добавь Петра Ивану отцом."
    expected:
      - "Не записывать связь: отчество и общая фамилия задают гипотезу, но не доказывают отцовство (`hypothesis` остаётся в реестре)."
      - "Наметить различающую проверку — запись рождения или иной документ, прямо называющий отца."

  - id: arca_user_record_conflict
    request: "В Arca у Анны дата рождения 1890. Прочитанная метрическая запись даёт 3 мая 1892 по старому стилю."
    expected:
      - "Не перезаписывать дату пользователя: добавить рождение по записи рядом — `JULIAN 3 MAY 1892`, со ссылкой и отметкой — и сохранить обе версии в реестре утверждений."
      - "Отметить запись пользователя как спорную, если документ ей противоречит; не пересчитывать дату в новый стиль."

  - id: arca_read_only
    request: "Подключение к Arca даёт проекту только чтение. Добавь найденных людей в древо."
    expected:
      - "Ничего не записывать в проект: право `read` — ограничение задачи."
      - "Оставить находки в деле и отчёте, сообщив, что для записи в древо нужен доступ на изменение."

  - id: arca_search_log_stays
    request: "Работаем с Arca. Заводить в нём задачу на каждый поиск?"
    expected:
      - "Нет: журнал поиска и очередь остаются в `search-log.csv` и рабочем плане дела."
      - "Задачу в Arca заводить, только когда она полезна пользователю в древе: шаг, который может сделать лишь он, или расхождение с его записями."

  - id: arca_namesake_in_tree
    request: "Найдена запись о браке Ивана Ольшина 1912 года. В Arca уже есть Иван Ольшин 1888 года рождения. Добавь брак ему."
    expected:
      - "Не присоединять запись по совпадению имени: сравнить возраст, место, родителей, свидетелей по матрице признаков."
      - "При неразрешённом сомнении вести кандидатов раздельно в реестре и ничего не записывать этому лицу."

  - id: arca_unavailable_midway
    request: "Посреди работы Arca перестал отвечать: приложение закрыли. Остановить исследование?"
    expected:
      - "Продолжать в папке дела; сообщить пользователю и записать результат в древо, когда доступ вернётся."

  - id: arca_one_parent_does_not_prove_spouse
    request: "В записи ребёнка назван только отец Иван. В Arca Иван состоит в паре с Марией; её материнство не установлено. Добавь ребёнка Ивану."
    expected:
      - "Проверить, не присоединит ли операция ребёнка к обоим супругам; не создавать ребро к Марии из супружества с Иваном."
      - "Записать только доказанное ребро, если доступные инструменты это позволяют; иначе сохранить его как single-source в деле и оставить перенос в очереди, продолжая исследование."
      - "Если ребёнок уже связан с обоими, общая отметка не может подтверждать неустановленное материнство."

  - id: arca_explicit_destination_wins
    request: "Arca подключён, но для этой ветви сохрани результаты только в моей локальной папке; древо пока не меняй."
    expected:
      - "Соблюсти выбранное место результата и не писать в Arca; подключение не расширяет поручение."

  - id: arca_private_files_and_missing_capability
    request: "Внеси найденные сведения в подключённое древо. Частный скан хранится локально; на его внешнюю передачу разрешения нет, а версия Arca не поддерживает evidence."
    expected:
      - "Не передавать частный скан; сохранить происхождение и результат в деле по существующим правилам приватности."
      - "Не подменять отсутствующую отметку подтверждением; оставить затронутую запись в очереди и продолжить доступную работу."
